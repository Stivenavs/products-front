name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      # Instalar Node (ajusta la versión según tu proyecto, ej: 22 si es lo que usas)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instalar dependencias
      - name: Install dependencies
        run: npm install
        working-directory: ./product-front

      # Construir la app de Angular
      - name: Build Angular App
        run: npm run build --if-present
        working-directory: ./product-front

      # Desplegar en Azure Static Web Apps
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_PEBBLE_0B4CA2A1E }}
          action: "upload"
          app_location: "./product-front"       # código fuente
          output_location: "dist/products-front" # carpeta generada tras build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
