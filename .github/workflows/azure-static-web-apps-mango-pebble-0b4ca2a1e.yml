name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # 1️⃣ Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Instalar Node.js 22
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # 3️⃣ Instalar dependencias Angular
      - name: Install dependencies
        run: npm install
        # Cambia aquí según la ubicación de package.json
        working-directory: ./product-front   # <- Cambia a '.' si está en la raíz del repo

      # 4️⃣ Build Angular
      - name: Build Angular App
        run: npm run build --if-present
        working-directory: ./product-front   # <- Cambia a '.' si está en la raíz del repo

      # 5️⃣ Detectar automáticamente la carpeta de salida de Angular
      - name: Detect Angular output folder
        id: detect-output
        run: |
          DIST_PATH=$(jq -r '.projects["product-front"].architect.build.options.outputPath' ./product-front/angular.json)
          echo "DIST_PATH=$DIST_PATH" >> $GITHUB_ENV

      # 6️⃣ Deploy a Azure Static Web Apps usando el dist generado
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_PEBBLE_0B4CA2A1E }}
          action: "upload"
          app_location: ./product-front          # <- Cambia a '.' si está en la raíz del repo
          output_location: ${{ env.DIST_PATH }}
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
