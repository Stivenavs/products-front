name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      # 1️⃣ Checkout del repo
      - uses: actions/checkout@v3

      # 2️⃣ Forzar Node 22 en el runner (Oryx lo detectará)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      # 3️⃣ (Opcional) Instalar dependencias localmente si quieres prebuild
      # - name: Install dependencies
      #   run: npm install
      #   working-directory: ./product-front

      # 4️⃣ Deploy con Oryx compilando en Azure
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_PEBBLE_0B4CA2A1E }}
          action: "upload"
          app_location: "./product-front"
          output_location: "dist/products-front"
          # NO skip_app_build, dejamos que Oryx compile usando Node 22

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
