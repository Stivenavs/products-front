name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Instalar Node.js 22.x (puedes cambiar a 20.x LTS si prefieres)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      # Instalar Angular CLI global
      - name: Install Angular CLI
        run: npm install -g @angular/cli@latest

      # Instalar dependencias (usa npm ci si existe package-lock.json, si no usa npm install)
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "📦 package-lock.json encontrado, usando npm ci"
            npm ci
          else
            echo "⚠️ No se encontró package-lock.json, usando npm install"
            npm install
          fi

      # Build y Deploy
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_MUD_0216DAC1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          ###### Configuración del proyecto Angular ######
          app_location: "./" # carpeta donde está package.json
          api_location: ""   # no hay API aquí
          output_location: "dist/product-front" # salida del build Angular
          ###### Fin de configuración ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_MUD_0216DAC1E }}
          action: "close"
